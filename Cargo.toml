[package]
name = "icicle-snark"
version = "0.1.0"
edition = "2021"

[lib]
name = "icicle_snark_ios"
crate-type = ["staticlib"]

[dependencies]
serde = { version="1.0.216", features = ["derive"] }
serde_json = { version="1.0.125" } 
num-bigint = "0.4.6"
bincode = "1.3.3"
rayon = "1.10.0"
memmap = "0.7.0"
clap = { version="4.5.23", features=["derive"] }

[target.aarch64-apple-ios.dependencies]
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "stas/ios/port1"}
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", features = ["metal_backend"], branch = "stas/ios/port1"}
icicle-bn254 = { git = "https://github.com/ingonyama-zk/icicle.git", features = ["metal_backend"], branch = "stas/ios/port1"}

[target.aarch64-linux-android.dependencies]
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "stas/android/port1"}
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "stas/android/port1"}
icicle-bn254 = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "stas/android/port1"}

[features]
default=[]
no-randomness=[]

[profile.release]
lto = true
codegen-units = 1
