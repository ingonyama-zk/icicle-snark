[package]
name = "icicle-snark"
version = "0.1.0"
edition = "2021"

[lib]
name = "icicle_snark"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde = { version = "1.0.216", features = ["derive"] }
serde_json = { version = "1.0.125" }
num-bigint = "0.4.6"
bincode = "1.3.3"
rayon = "1.10.0"
memmap = "0.7.0"
clap = { version = "4.5.23", features = ["derive"] }
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "mobile"}
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "mobile"}
icicle-bn254 = { git = "https://github.com/ingonyama-zk/icicle.git", branch = "mobile"}

[features]
default = []
no-randomness = []
debug = []
ios = ["icicle-runtime/metal_backend", "icicle-bn254/metal_backend"]

[profile.release]
lto = false
strip = false
codegen-units = 1
panic = "abort"
